
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Date with K8</title>
  <style>
    @font-face {
  font-family: 'eurostile';
  src: url('assets/fonts/eurostile.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
    }

    @font-face {
  font-family: 'recoleta';
  src: url('assets/fonts/recoleta.otf') format('truetype');
  font-weight: normal;
  font-style: normal;
    }
    
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      float: left;
      background: #1a1a1a;
      font-family: 'Monaco', monospace;
      overflow: hidden;
    }

    iframe {
      width: 960px;
      height: 540px;
      aspect-ratio: 16/9;
      border: none;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .game-container {
      width: 960px;
      height: 540px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('assets/homebg.png');
      border-radius: 12px;
      border: none;
      overflow: hidden;
    }

    .message {
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
    }

    .message.box {
      background: none;
      color: rgb(242, 242, 242);
      text-align: center;
      font-family: 'recoleta';
      font-size: 75px;
    }

    .message.box.again {
      margin-top: 40px;
      background: none;
      color: rgb(199, 199, 199);
      text-align: center;
      font-family: 'recoleta';
      font-size: 30px;
    }

    .input-container {
      position: absolute;
      width: 60%;
      bottom: 10%;
      justify-content: center;
      align-items: center;
      display: flex;
      gap: 10px;
    }

    .input-container button {
      padding: 10px 15px;
      border: none;
      background-color: #00db00;
      color: white;
      font-size: 30px;
      font-family: 'eurostile';
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }

    .input-container button:hover {
        background-color: #009700;
    }

    .input-container button:active {
        background-color: #e8ffe8;
    }

    #fadeOut {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    opacity: 0;                         
    transition: opacity 2s ease-in; 
    z-index: 4;
    pointer-events: none;
    }

  </style>
</head>

<body>
<div class="iframe">
  <div class="game-container">
    <div class="message box"><b>A Date with K8</b>
      <div class="message box again">Begin?</div>
    </div>
    <div class="input-container">
      <a href="page1.html" class="delayed-link">
        <button id="startButton" onclick="lesgo()">Log on.</button>
      </a>
     </div>
    <div id="fadeOut"></div>
  </div>
</div>

  <script>

  document.getElementById('startButton').addEventListener('click', function(e) {
    var fadeOut = document.getElementById('fadeOut');
          setTimeout(() => {
          fadeOut.style.opacity = 1;
          }, 0); 
});

document.querySelector('.delayed-link').addEventListener('click', function(e) {
    e.preventDefault();
    var self = this;
    setTimeout(function() {
        window.location.href = self.href; 
    }, 2000);
});

    startButton.addEventListener('click', lesgo);

 function lesgo() {
        var audio = new Audio('assets/sfxbling.mp3');
        audio.play();
    }
  </script>
  
</body>
</html>
